[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BUSL-1.1"
repository = "https://github.com/yu7dan/onra"

[workspace.dependencies]
onra-core = { path = "crates/onra-core" }
onra-proto = { path = "crates/onra-proto" }
onra-venues = { path = "crates/onra-venues" }
onra-ui = { path = "crates/onra-ui" }
onra-keystore = { path = "crates/onra-keystore" }
onra-signer = { path = "crates/onra-signer" }

argon2 = "0.5"
bs58 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
ed25519-dalek = { version = "3", features = ["zeroize"] }
enable-ansi-support = "0.2"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
humantime = "2"
interprocess = { version = "2.4", features = ["tokio"] }
k256 = { version = "0.14", features = ["ecdsa"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rpassword = "7"
rust_decimal = { version = "1", features = ["serde-with-str"] }
shell-words = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "0.8"
unicode-width = "0.2"
zeroize = { version = "1", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Key derivation is deliberately slow; unoptimized it takes seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
